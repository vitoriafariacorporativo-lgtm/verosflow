name: One-time Storage filename fix

on:
  push:
    branches: [main]
    paths: ['.verosflow-storage-fix-trigger']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch upload path
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const path = `${pastaPrefixo}/${Date.now()}_${file.name}`.replace(/\\s+/g,'_');"
          new = '''const safeName = String(file.name || 'arquivo')
        .normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')
        .replace(/[^a-zA-Z0-9._-]+/g,'_')
        .replace(/^\\.+|\\.+$/g,'')
        .slice(0,180) || 'arquivo';
      const safePrefix = String(pastaPrefixo || 'anexos')
        .replace(/[^a-zA-Z0-9._\\/-]+/g,'_')
        .replace(/\\/+/g,'/')
        .replace(/^\\/+|\\/+$/g,'');
      const path = `${safePrefix}/${Date.now()}_${safeName}`;'''
          if old not in s:
              raise SystemExit('upload line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Upload path corrigido.')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: normalizar nomes dos anexos no Storage [skip ci]' && git push)
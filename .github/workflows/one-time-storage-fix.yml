name: One-time Storage filename fix

on:
  push:
    branches: [main]
    paths: ['.verosflow-storage-fix-trigger']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch upload path
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); old="const path = `${pastaPrefixo}/${Date.now()}_${file.name}`.replace(/\\s+/g,\'_\');"; new="""const safeName = String(file.name || 'arquivo')\n        .normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')\n        .replace(/[^a-zA-Z0-9._-]+/g,'_')\n        .replace(/^\\.+|\\.+$/g,'')\n        .slice(0,180) || 'arquivo';\n      const safePrefix = String(pastaPrefixo || 'anexos')\n        .replace(/[^a-zA-Z0-9._\\/-]+/g,'_')\n        .replace(/\\/+/g,'/')\n        .replace(/^\\/+|\\/+$/g,'');\n      const path = `${safePrefix}/${Date.now()}_${safeName}`;"""; assert old in s, "upload line not found"; p.write_text(s.replace(old,new,1),encoding="utf-8")'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: normalizar nomes dos anexos no Storage [skip ci]' && git push)
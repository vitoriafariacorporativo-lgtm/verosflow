name: One-time Storage filename fix

on:
  push:
    branches: [main]
    paths: ['.verosflow-storage-fix-trigger']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch upload path
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = base64.b64decode('Y29uc3QgcGF0aCA9IGAke3Bhc3RhUHJlZml4b30vJHtEYXRlLm5vdygpfV8ke2ZpbGUubmFtZX1gLnJlcGxhY2UoL1xzKy9nLCdfJyk7').decode()
          new = base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('upload line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Upload path corrigido.')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: normalizar nomes dos anexos no Storage [skip ci]' && git push)
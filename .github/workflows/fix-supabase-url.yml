name: VerOS Flow deployment patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply persistence patch
        shell: bash
        env:
          PATCH_B64: PLACEHOLDER
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patch=base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          marker='/* VEROS_FLOW_PERSISTENCE_PATCH_V1 */'
          if marker not in s:
              insertion='\n<script>\n'+marker+'\n'+patch+'\n</script>\n'
              s=s.replace('</body>', insertion+'</body>')
          s=s.replace('https://sdpwhompowjhoijrczxy.supabaseClient.co','https://sdpwhompowjhoijrczxy.supabase.co')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix VerOS Flow Supabase persistence'
          git push

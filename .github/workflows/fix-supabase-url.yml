name: Fix Supabase URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Supabase project URL
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://sdpwhompowjhoijrczxy.supabaseClient.co'
          new = 'https://sdpwhompowjhoijrczxy.supabase.co'
          if old not in s:
              print('No incorrect Supabase URL found.')
              raise SystemExit(0)
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Supabase project URL'
          git push

name: Restore VerOS Flow index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good complete index
        run: |
          git checkout b0622bee9f2d5e2bf9df8c68494f2ef7437612ec -- index.html
          if grep -qi 'supabaseclient\.co' index.html; then
            echo 'ERROR: invalid Supabase hostname found in restored index.html'
            exit 1
          fi
          grep -q 'sdpwhompowjhoijrczxy.supabase.co' index.html

      - name: Commit restored index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already restored'
          else
            git commit -m 'fix: restore complete VerOS Flow index'
            git push
          fi

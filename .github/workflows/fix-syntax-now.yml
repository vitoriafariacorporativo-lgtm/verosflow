name: Repair VerOS Flow syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'onClick:async function({': 'onClick:async function(){',
              'Document.getElementById': 'document.getElementById',
              "catch(err){console.error('[VerOS Flow] Erro ao salvar produto:',w);": "catch(err){console.error('[VerOS Flow] Erro ao salvar produto:',err);",
              'Preencha código, cultura e variaedade': 'Preencha código, cultura e variedade',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          bad=[]
          if 'onClick:async function({' in s: bad.append('malformed function({')
          if 'Document.getElementById' in s: bad.append('Document.getElementById')
          if "Erro ao salvar produto:',w" in s: bad.append('undefined w')
          if bad: raise SystemExit('Remaining problems: '+', '.join(bad))
          PY
      - name: Commit repaired file and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-syntax-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-syntax-now.yml
          git commit -m 'Fix VerOS Flow JavaScript syntax and form handlers'
          git push

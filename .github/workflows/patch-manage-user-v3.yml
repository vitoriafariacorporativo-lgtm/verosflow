name: Patch VerOS Flow user manager
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update function endpoint
        shell: bash
        run: |
          sed -i "s/functions.invoke('manage-user'/functions.invoke('manage-user-v3'/g" index.html
          sed -i 's/functions.invoke("manage-user"/functions.invoke("manage-user-v3"/g' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix user persistence endpoint'
          git push

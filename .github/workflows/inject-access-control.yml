name: Inject VerOS Flow access control
on:
  push:
    branches: [main]
    paths:
      - 'access-control.js'
      - '.github/workflows/inject-access-control.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./access-control.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html sem </body>')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: ativar controle de acesso por perfil [skip ci]'
          git push

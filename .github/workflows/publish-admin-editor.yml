name: Publish admin editor

on:
  push:
    branches: [main]
    paths:
      - 'admin-editor.js'
      - '.github/workflows/publish-admin-editor.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach admin editor to the app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./admin-editor.js?v=20260812"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Não foi encontrado </body> em index.html')
              text = text.replace(marker, tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Admin editor anexado ao index.html')
          else:
              print('Admin editor já está anexado; nada a fazer')
          PY

      - name: Commit publication
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git commit -m 'chore: publish Comercial ADM pedido editor'
          git push

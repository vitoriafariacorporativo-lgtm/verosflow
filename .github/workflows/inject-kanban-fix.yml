name: Inject Kanban screen scroll fix

on:
  push:
    paths:
      - 'kanban-screen-fix.js'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Inject Kanban fix script into index.html
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'kanban-screen-fix.js' index.html; then
            sed -i 's#</body>#<script src="./kanban-screen-fix.js?v=20260812"></script>\\n</body>#' index.html
          fi

      - name: Commit injection
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Kanban fix já está carregado no index.html.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Carregar correção de rolagem do Kanban'
          git push origin HEAD:main

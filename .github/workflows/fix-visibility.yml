name: Fix global visibility for Financeiro Logística Operações

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch visibility rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """  visibleSolicitacoes(){
    let list = DB.solicitacoes.slice();
    if(STATE.currentProfile === 'RC'){
      list = list.filter(s=>s.nomeRC === STATE.currentUser.nome);
    } else if(STATE.currentProfile === 'ADM_UBS' || STATE.currentProfile === 'COORD_FIN' || STATE.currentProfile === 'COORD_LOG' || STATE.currentProfile === 'OPERACOES'){
      list = list.filter(s=>s.unidade === STATE.currentUser.unidade || STATE.currentUser.unidade === s.unidade);"""
          new = """  visibleSolicitacoes(){
    let list = DB.solicitacoes.slice();
    const profile = String(STATE.currentProfile || STATE.currentUser?.perfil || '').trim().toUpperCase();
    if(profile === 'RC' || profile === 'SOLICITANTE' || profile === 'REQUISITANTE'){
      const uid = STATE.currentUser?.id;
      const nome = String(STATE.currentUser?.nome || '').trim().toUpperCase();
      list = list.filter(s =>
        (uid && String(s.rcUsuarioId || s.rc_usuario_id || '').toLowerCase() === String(uid).toLowerCase()) ||
        String(s.nomeRC || s.nome_rc || '').trim().toUpperCase() === nome
      );
    } else if(profile === 'ADM_UBS' || profile === 'ADM UBS' || profile === 'ADMINISTRADOR UBS' || profile === 'ADMINISTRADOR DA UBS'){
      const unidadeUsuario = String(STATE.currentUser?.unidade || STATE.currentUser?.unidade_id || '').trim().toLowerCase();
      list = list.filter(s => String(s.unidade || s.unidade_id || '').trim().toLowerCase() === unidadeUsuario);
    } else if(['COORD_FIN','COORDENADOR FINANCEIRO','COORD_LOG','COORDENADOR LOGISTICA','OPERACOES','OPERACOES DE NEGOCIO'].includes(profile)){
      // Financeiro, Logística e Operações: TODOS os pedidos, sem filtro de unidade, RC ou status.
      list = DB.solicitacoes.slice();
    }
"""
          if old not in s:
              raise SystemExit('Bloco de visibilidade esperado não encontrado; nenhuma alteração realizada.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-visibility.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "Corrigir visualização global de Financeiro Logística e Operações"
          git push origin main

name: Fix UBS routing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch ADM UBS distribution rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('access-control.js')
          s = p.read_text(encoding='utf-8')
          old = "if(r==='ADM_UBS') return s.unidade===STATE.currentUser.unidade || s.unidadeId===STATE.currentUser.unidade_id;"
          new = "if(r==='ADM_UBS') return window.VerOSRequestVisibility?.unitMatches ? window.VerOSRequestVisibility.unitMatches(s, STATE.currentUser) : (s.unidadeId===STATE.currentUser.unidade_id || s.unidade===STATE.currentUser.unidade);"
          if old not in s:
              print('Patch already applied or target not found; no change needed.')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- access-control.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add access-control.js
          git commit -m "Corrigir distribuição do ADM UBS pela unidade do pedido"
          git push

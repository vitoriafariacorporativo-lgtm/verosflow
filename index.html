<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VerOS Flow</title></head><body><div style="font-family:Arial;padding:30px">Carregando VerOS Flow…</div><script>
(async()=>{
 try{
  const url='https://raw.githubusercontent.com/vitoriafariacorporativo-lgtm/verosflow/b0622bee9f2d5e2bf9df8c68494f2ef7437612ec/index.html';
  const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('Falha ao carregar a versão base: '+r.status);
  let html=await r.text();
  html=html.replace('</body>','<script src="https://vitoriafariacorporativo-lgtm.github.io/verosflow/user-sync.js"></script></body>');
  document.open(); document.write(html); document.close();
 }catch(e){document.body.innerHTML='<pre style="font-family:monospace;white-space:pre-wrap;padding:30px">Erro ao carregar o VerOS Flow: '+String(e.message||e)+'</pre>';}
})();
</script></body></html>
